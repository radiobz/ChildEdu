name: 每周学校数据自动采集

on:
  schedule:
    # 每周一早上8点（北京时间）跑一次
    - cron: '0 0 * * 1'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 采集学校数据
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          BATCH_SIZE: '20'
        run: python3 scripts/enrich_schools.py

      - name: 提交新数据
        run: |
          git config user.name "ChildEdu Bot"
          git config user.email "bot@childedu.app"
          git add data/schools.json
          git diff --staged --quiet || git commit -m "auto: 采集更新学校数据 ($(date +%Y-%m-%d))"
          git push
