name: 学校数据自动采集
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 采集学校数据
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: https://open.bigmodel.cn/api/paas/v4
          AI_MODEL: glm-4-flash
          BATCH_SIZE: 100
        run: python3 scripts/enrich_schools.py
      - name: 提交新数据
        run: |
          git config user.name "ChildEdu Bot"
          git config user.email "bot@childedu.app"
          git add data/schools.json data/school_zones.json
          git diff --staged --quiet || git commit -m "auto: 采集更新学校数据"
          git push
