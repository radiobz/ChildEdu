<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Debug2</title></head>
<body>
<h3>Config & Data Debug</h3>
<pre id="out">loading...</pre>
<script src="js/config.js?v=15"></script>
<script>
(async () => {
  const out = document.getElementById('out');
  try {
    out.textContent = 'APP_CONFIG.BASE_PATH = ' + (window.APP_CONFIG ? JSON.stringify(window.APP_CONFIG.BASE_PATH) : 'UNDEFINED') + '\n';
    const base = (window.APP_CONFIG && window.APP_CONFIG.BASE_PATH) || '';
    const url = base + '/data/schools.json?v=15';
    out.textContent += 'fetch url = ' + url + '\n';
    const res = await fetch(url);
    out.textContent += 'HTTP ' + res.status + ' ok=' + res.ok + '\n';
    const raw = await res.json();
    out.textContent += 'count=' + raw.length + '\n';
    const hits = raw.filter(s => (s.name||'').includes('仁厚庄'));
    out.textContent += 'hits=' + hits.length + '\n';
  } catch(e) {
    out.textContent += 'ERROR: ' + e.message + '\n' + e.stack;
  }
})();
</script>
</body>
</html>
