<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Debug</title></head>
<body>
<h3>Data Load Debug</h3>
<pre id="out">loading...</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  try {
    const res = await fetch('data/schools.json?v=99');
    out.textContent = 'HTTP ' + res.status + ' ok=' + res.ok + '\n';
    const raw = await res.json();
    out.textContent += 'count=' + raw.length + '\n';
    const hits = raw.filter(s => (s.name||'').includes('仁厚庄'));
    out.textContent += 'hits=' + hits.length + '\n';
    hits.slice(0,5).forEach(s => out.textContent += ' - ' + s.name + ' | loc=' + JSON.stringify(s.location) + '\n');
  } catch(e) {
    out.textContent = 'ERROR: ' + e.message + '\n' + e.stack;
  }
})();
</script>
</body>
</html>
