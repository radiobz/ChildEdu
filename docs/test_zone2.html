<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zone Debug2</title>
<style>html,body,#mapContainer{margin:0;padding:0;width:100%;height:100%;}
#log{position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.8);color:#0f0;padding:10px;font-size:12px;z-index:9999;max-width:600px;white-space:pre-wrap;}</style>
</head>
<body>
<div id="mapContainer"></div>
<div id="log">waiting...</div>
<script src="https://webapi.amap.com/maps?v=2.0&key=d7157c269a38ac7b76bdfd4ebd3c65ed&plugin=AMap.MouseTool,AMap.PlaceSearch&securityJsCode=779a904a1f6470346e28266b4135d91"></script>
<script src="js/config.js?v=15"></script>
<script>
const log = document.getElementById('log');
const addLog = (m) => { log.textContent += '\n' + m; };
window.APP_CONFIG = Object.assign({}, window.APP_CONFIG, { BASE_PATH: '', DEFAULT_CENTER: [108.9498, 34.2245], DEFAULT_ZOOM: 15 });
</script>
<script src="js/map.js"></script>
<script>
setTimeout(() => {
  try {
    MapManager.init();
    addLog('map inited, AMap.Circle type = ' + (typeof AMap.Circle));
    setTimeout(() => {
      try {
        addLog('calling highlightZoneRoads...');
        MapManager.highlightZoneRoads(
          ['小寨西路','南二环路','兴善寺街','朱雀路'],
          108.9498, 34.2245,
          ['兴善寺']
        );
        addLog('called OK');
        setTimeout(() => {
          const m = MapManager.getMap();
          if (m) {
            addLog('zoom=' + m.getZoom() + ' center=' + JSON.stringify(m.getCenter()));
          }
        }, 2500);
      } catch(e) { addLog('ERROR calling: ' + e.message + '\n' + e.stack); }
    }, 1500);
  } catch(e) { addLog('ERROR init: ' + e.message + '\n' + e.stack); }
}, 800);
</script>
</body>
</html>
